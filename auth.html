<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register • GyaanXpress</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="auth">
    <header class="site-header">
      <nav class="navbar">
        <a class="logo" href="index.html">GyaanXpress</a>
        <div class="nav-links">
          <a href="listings.html">Listings</a>
          <a href="emergency.html">Emergency Stay</a>
          <a href="help.html">Help</a>
          <a href="contact.html">Contact</a>
          <a href="auth.html" class="btn-outline">Login / Register</a>
        </div>
      </nav>
    </header>

    <main class="page auth">
      <section class="auth-grid">
        <div class="form-card">
          <h2>Login</h2>
          <form>
            <label>
              Email
              <input type="email" placeholder="student@email.com" />
            </label>
            <label>
              Password
              <input type="password" placeholder="Password" />
            </label>
            <button class="btn-primary" type="button">Login</button>
          </form>
        </div>
        <div class="form-card">
          <h2>Register</h2>
          <form>
            <label>
              Name
              <input type="text" placeholder="Student name" />
            </label>
            <label>
              Email
              <input type="email" placeholder="student@email.com" />
            </label>
            <label>
              Phone
              <input type="text" placeholder="Phone" />
            </label>
            <button class="btn-primary" type="button">Create Account</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <h3>GyaanXpress</h3>
        <p>Verified Student Housing — Direct Owner Contact.</p>
      </div>
      <div class="footer-links">
        <a href="listings.html">Listings</a>
        <a href="help.html">Help</a>
        <a href="contact.html">Contact</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
