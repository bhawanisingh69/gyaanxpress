<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Help • GyaanXpress</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="help">
    <header class="site-header">
      <nav class="navbar">
        <a class="logo" href="index.html">GyaanXpress</a>
        <div class="nav-links">
          <a href="listings.html">Listings</a>
          <a href="emergency.html">Emergency Stay</a>
          <a href="help.html" class="active">Help</a>
          <a href="contact.html">Contact</a>
          <a href="auth.html" class="btn-outline">Login / Register</a>
        </div>
      </nav>
    </header>

    <main class="page">
      <section class="page-header">
        <div>
          <h1>Help &amp; Support</h1>
          <p>Tell us what you need and we will match you with a verified option.</p>
        </div>
      </section>

      <section class="form-card">
        <h2>Student Requirement Form</h2>
        <form>
          <div class="form-grid">
            <label>
              City
              <input type="text" placeholder="City" />
            </label>
            <label>
              Budget
              <input type="text" placeholder="Budget" />
            </label>
            <label>
              Property Type
              <select>
                <option>PG</option>
                <option>Hostel</option>
                <option>Library</option>
                <option>Gym</option>
                <option>Mess</option>
                <option>1BHK</option>
                <option>2BHK</option>
              </select>
            </label>
            <label>
              Phone
              <input type="text" placeholder="Phone" />
            </label>
          </div>
          <button class="btn-primary" type="button">Let GyaanXpress Help You</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <h3>GyaanXpress</h3>
        <p>Verified Student Housing — Direct Owner Contact.</p>
      </div>
      <div class="footer-links">
        <a href="listings.html">Listings</a>
        <a href="help.html">Help</a>
        <a href="contact.html">Contact</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
